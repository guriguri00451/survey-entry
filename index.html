var DATA = {"title": "頭の中に光と音が入り込む感覚を作り出す錯覚システム", "articles": [{"blocks": [{"t": "s", "x": "国内の研究チームが、光と音が頭の中に流れ込むように感じる新しい錯覚システムを開発し、国際会議で発表した。複数の感覚を一致させることで生じる錯覚で、想像上の「身体内部」を対象にした点が新しい。"}, {"t": "h", "x": "どんな体験か"}, {"t": "p", "x": "体験者はマジックミラー越しに自分の頭部の鏡像を見る。鏡像には左右で独立して光る半球状の「脳」の映像が重なる。実験者が色の変わる電球を頭の片側に押し当てると、同じ側の脳がその色に変わり、同時に同じ側から音が鳴る。脳は場所とタイミングの一致した感覚情報を一つの出来事として統合する性質を持ち、これを利用している。"}, {"t": "h", "x": "何が新しいか"}, {"t": "p", "x": "視覚・聴覚・触覚の場所とタイミングが一致することで、光が頭の中に流れ込み内部が変化したように感じる。従来の錯覚は身体の外側を対象としてきたが、この研究は想像上の頭内空間を舞台にする。思考やイメージを光や音として感じられる形に変換できれば、創作支援や没入感の高い体験表現への応用が期待されるとしている。"}]}, {"blocks": [{"t": "p", "x": "国内の研究チームが、光と音が頭の中に流れ込んでくるように感じる新しい錯覚体験システムを開発し、インタラクション技術に関する国際会議で発表した。体験者はマジックミラーと呼ばれる半透過の鏡越しに自分の頭部の鏡像を見る。その鏡像には、左右で独立して光る半球状の「脳」の映像が重ねて表示される。実験者が色の変わる電球を体験者の頭の左右どちらかに押し当てると、同じ側の脳の映像がその色に変わり、同時に同じ側から音が鳴る。人の脳は場所とタイミングが一致して届く異なる感覚の情報を一つの出来事として統合する性質を持ち、この性質を利用して視覚・聴覚・触覚を一致させることで、光が頭の中に流れ込み、内部の状態が変化したように感じられるという。従来の錯覚体験は身体の外側を対象としてきたが、この研究は想像上の「身体内部」を対象にした点が新しい。思考やイメージを光や音として感じられる形に変換できれば、創作支援や没入感の高い体験表現への応用が期待されるとしている。"}]}, {"blocks": [{"t": "s", "x": "名古屋市立大学の研究チームが、光と音が頭の中に流れ込むように感じる錯覚システムを開発した。視覚・聴覚・触覚の一致から生じる錯覚で、想像上の「身体内部」を対象にした点が新しい。成果はインタラクション技術に関する国際会議で発表された。"}, {"t": "h", "x": "体験のしくみ"}, {"t": "p", "x": "体験者はマジックミラーと呼ばれる半透過の鏡越しに、自分の頭部の鏡像を見る。マジックミラーは鏡として像を映しながら、背後の映像を重ねて見せることができる。鏡像には、左右で独立して発光する半球状の「脳」の映像が重ねて表示され、体験者からは自分の頭の中に脳が発光しているかのように見える。実験者が手に持った電球を振ると電球の色がランダムに変化し、電球を体験者の頭部の左右どちらかに押し当てると、同じ側の半球にその色がコピーされるように映像が変化する。同時に、押し当てた側に対応した音が左右のスピーカーから提示される。"}, {"t": "h", "x": "錯覚が生じる理由"}, {"t": "p", "x": "視覚（左右の色の変化）、聴覚（左右に同期した音）、触覚（頭部への接触）の場所とタイミングを一致させることで、電球の光があたかも頭の中に流れ込み、内部の状態が変化したかのように感じられ、音が頭の内部に定位するかのような錯覚が生まれる。人の脳は、異なる感覚の情報が同じ場所・同じタイミングで届くと一つの出来事として統合する性質を持ち、これを利用している。"}, {"t": "h", "x": "何が新しいか"}, {"t": "p", "x": "従来の錯覚体験は身体の外観や表面を対象としてきたが、このシステムは想像上の「身体内部」に着目した錯覚設計である。研究チームはこれまでにも、皮膚が極端に伸びるように感じる錯覚など、身体に関する独自の錯覚体験を提案してきており、今回の成果はその流れに位置づけられる。視聴覚の映像を身体の外に提示するだけでなく、頭の中に投影するという新しい体験設計の方向性を示した。"}, {"t": "h", "x": "期待される応用"}, {"t": "p", "x": "想像や思考といった内的体験を光や音として感覚的に捉えられる形に変換できる可能性がある。創作活動や発想支援への応用が期待されるほか、音楽に合わせて頭の中で光や色が変化する体験は、リラクゼーションや没入感の向上につながる可能性があるとしている。"}]}, {"blocks": [{"t": "p", "x": "名古屋市立大学の研究チームは、光と音が自分の頭の中に流れ込んでくるように感じる、新しい錯覚体験システムを開発した。成果はインタラクション技術に関する国際会議で発表された。"}, {"t": "p", "x": "この体験では、体験者はマジックミラーと呼ばれる半透過の鏡越しに、自分の頭部の鏡像を見る。マジックミラーは鏡として像を映しながら、背後の映像を重ねて見せることができる。その鏡像には、左右で独立して発光する半球状の「脳」の映像が重ね合わせて表示される。実験者が手に持った電球を振ると電球の色がランダムに変化し、その電球を体験者の頭部の左右どちらかに押し当てると、押し当てたのと同じ側の半球にその色がコピーされるように映像が変化する。同時に、押し当てた側に対応した音が左右のスピーカーから提示される。"}, {"t": "p", "x": "このように、視覚（左右の色の変化）、聴覚（左右に同期した音）、触覚（頭部への接触）の場所とタイミングを一致させることで、電球の光があたかも頭の中に流れ込み、内部の状態が変化したかのように感じられ、音が頭の内部に定位するかのような錯覚が生まれる。人の脳は、異なる感覚からの情報が同じ場所・同じタイミングで届くと、それらを一つの出来事として統合する性質を持つ。この性質を利用して、実際には頭の外にある光と音を、頭の内部の出来事であるかのように体験させている。"}, {"t": "p", "x": "従来の錯覚体験は、身体の外観や表面を対象としてきたが、このシステムは想像上の「身体内部」に着目した錯覚設計である点が新しい。研究チームはこれまでにも、皮膚が極端に伸びるように感じる錯覚など、身体に関する独自の錯覚体験を提案してきており、今回の成果はその流れに位置づけられる。視聴覚の映像を身体の外に提示するだけでなく、頭の中に投影するという新しい体験設計の方向性を示したとしている。"}, {"t": "p", "x": "この成果は、想像や思考といった内的体験を、光や音として感覚的に捉えられる形に変換できる可能性を示す。創作活動や発想支援への応用が期待されるほか、音楽に合わせて頭の中で光や色が変化する体験は、リラクゼーションや没入感の向上にもつながる可能性があるとしている。"}]}, {"blocks": [{"t": "s", "x": "名古屋市立大学の研究チームが、光と音が頭の中に流れ込むように感じる錯覚システムを開発した。視覚・聴覚・触覚の一致から生じる錯覚で、想像上の「身体内部」を対象にした点が新しい。成果はインタラクション技術に関する国際会議で発表された。"}, {"t": "h", "x": "背景"}, {"t": "p", "x": "現実と仮想の世界を融合させるXR技術は、映像や音を身体の外側に提示することで発展してきた。エンターテインメントや教育、医療訓練など幅広い応用が進む一方で、その表現は主に身体の外側への情報提示に限られてきた。この状況の中で、人の感覚や知覚の仕組みを利用し、実際にはない出来事を身体の内側で起きているかのように感じさせる「錯覚」を体験設計に取り入れる研究が注目されている。今回の成果もその一つである。"}, {"t": "h", "x": "体験のしくみ"}, {"t": "p", "x": "体験者はマジックミラーと呼ばれる半透過の鏡越しに、自分の頭部の鏡像を見る。マジックミラーは鏡として像を映しながら、背後の映像を重ねて見せることができる。鏡像には、左右で独立して発光する半球状の「脳」の映像が重ねて表示され、体験者からは自分の頭の中に脳が発光しているかのように見える。"}, {"t": "h", "x": "実験の手順"}, {"t": "p", "x": "実験者が手に持った電球を振ると、電球の色がランダムに変化する。続けてその電球を体験者の頭部の左右どちらかに押し当てると、同じ側の半球にその色がコピーされるように映像が変化する。同時に、押し当てた側に対応した音が左右のスピーカーから提示される。電球に触れられた側と同じ方向から音が聞こえるため、体験者には光と音の両方が頭内に入ってくるように感じられる。こうして、電球の光が頭の中に流れ込み、内部の状態が変化したかのように感じられ、音が頭の内部に定位するかのような錯覚が生まれる。"}, {"t": "h", "x": "錯覚が生じる理由"}, {"t": "p", "x": "視覚（左右の色の変化）、聴覚（左右に同期した音）、触覚（頭部への接触）という三つの感覚の場所とタイミングが一致するためである。人の脳は、異なる感覚からの情報が同じ場所・同じタイミングで届くと、それらを一つの出来事として統合する性質を持つ。この性質を利用し、実際には頭の外にある光と音を、頭の内部の出来事であるかのように体験させている。"}, {"t": "h", "x": "何が新しいか"}, {"t": "p", "x": "従来の錯覚体験は、主に身体の外観や表面を対象としてきた。これに対し、このシステムは想像上の「身体内部」に着目した錯覚設計である。研究チームはこれまでにも、皮膚が極端に伸びるように感じる「スライムハンド錯覚」や、身体の内側に物体が侵入してくるように感じる「XRAY錯覚」など、身体に関する独自の錯覚体験を継続的に提案してきており、今回の成果はその流れに位置づけられる。視聴覚の映像を身体の外に提示するだけでなく、頭の中に投影するという新しい体験設計の方向性を示し、映像メディアを頭の中に直接投影して身体の内側から出来事を体感するXR技術の基盤として、重要な知見になると位置づけている。"}, {"t": "h", "x": "期待される応用"}, {"t": "p", "x": "想像や思考といった内的体験を、光や音として感覚的に捉えられる形に変換できる可能性がある。抽象的で捉えにくいイメージや発想を「感じ取れる対象」として扱うことで、創作活動や発想支援における新しいインタラクション手法としての応用が期待される。"}, {"t": "p", "x": "また、音楽プレイヤーの映像表現のような体験を頭の中で生じさせることができる。音に合わせて頭内で光や色が変化する体験は、リラクゼーションや没入感の向上につながる可能性がある。視聴覚刺激を身体の外側に配置する従来のXR表現とは異なり、体験者自身の頭内空間を舞台とすることで、より私的で没入度の高い体験表現が可能となる。"}]}, {"blocks": [{"t": "p", "x": "名古屋市立大学の研究チームは、光と音が自分の頭の中に流れ込んでくるように感じる、新しい錯覚体験システムを開発した。成果はインタラクション技術に関する国際会議で発表された。"}, {"t": "p", "x": "現実と仮想の世界を融合させるXR技術は、映像や音を身体の外側に提示することで発展してきた。エンターテインメントや教育、医療訓練など幅広い応用が進む一方で、その表現は主に身体の外側への情報提示に限られてきた。この状況の中で、人の感覚や知覚の仕組みを利用し、実際にはない出来事を身体の内側で起きているかのように感じさせる「錯覚」を体験設計に取り入れる研究が注目されている。今回の成果もその一つである。"}, {"t": "p", "x": "この体験では、体験者はマジックミラーと呼ばれる半透過の鏡越しに、自分の頭部の鏡像を見る。マジックミラーは鏡として像を映しながら、背後の映像を重ねて見せることができる。その鏡像には、左右で独立して発光する半球状の「脳」の映像が重ね合わせて表示される。体験者からは、自分の頭の中に脳が発光しているかのように見える。"}, {"t": "p", "x": "実験の手順は次の通りである。実験者が手に持った電球を振ると、電球の色がランダムに変化する。続けてその電球を体験者の頭部の左右どちらかに押し当てると、押し当てたのと同じ側の半球にその色がコピーされるように映像が変化する。同時に、押し当てた側に対応した音が左右のスピーカーから提示される。電球に触れられた側と同じ方向から音が聞こえるため、体験者には光と音の両方が頭内に入ってくるように感じられる。こうして、電球の光が頭の中に流れ込み、内部の状態が変化したかのように感じられ、音が頭の内部に定位するかのような錯覚が生まれる。"}, {"t": "p", "x": "この錯覚が生じるのは、視覚（左右の色の変化）、聴覚（左右に同期した音）、触覚（頭部への接触）という三つの感覚の場所とタイミングが一致するためである。人の脳は、異なる感覚からの情報が同じ場所・同じタイミングで届くと、それらを一つの出来事として統合する性質を持つ。この性質を利用し、実際には頭の外にある光と音を、あたかも頭の内部の出来事であるかのように体験させている。"}, {"t": "p", "x": "錯覚を研究対象としてきた従来の体験設計は、主に身体の外観や表面を対象としてきた。これに対し、このシステムは想像上の「身体内部」に着目した錯覚設計である点が新しい。研究チームはこれまでにも、皮膚が極端に伸びるように感じる「スライムハンド錯覚」や、身体の内側に物体が侵入してくるように感じる「XRAY錯覚」など、身体に関する独自の錯覚体験を継続的に提案してきており、今回の成果はその流れの中に位置づけられる。"}, {"t": "p", "x": "研究チームは、視聴覚の映像を身体の外に提示するだけでなく、頭の中に投影するという新しい体験設計の方向性を示したとしている。映像メディアを頭の中に直接投影し、身体の内側から出来事を体感するXR技術の基盤として、重要な知見になると位置づけている。この成果は、想像や思考といった内的体験を、光や音として感覚的に捉えられる形に変換できる可能性を示す。抽象的で捉えにくいイメージや発想を、体験者自身が「感じ取れる対象」として扱うことで、創作活動や発想支援における新しいインタラクション手法としての応用が期待される。"}, {"t": "p", "x": "また、この錯覚体験は、音楽プレイヤーで再生中に表示される映像表現のような体験を、実際に頭の中で生じさせることができる。音に合わせて頭内で光や色が変化しているように感じられる体験は、リラクゼーションや没入感の向上につながる可能性がある。さらに、視聴覚刺激を身体の外側に配置する従来のXR表現とは異なり、体験者自身の頭内空間を舞台とすることで、より私的で没入度の高い体験表現が可能となるとしている。"}]}]};

// ===== 帯マーカー（A〜F）を本文の実測高さで6等分して右マージンに配置 =====
var N_BANDS = 6;
var bandTop = [];   // 各帯の開始Y座標
var bandAt = [];    // 各帯への初到達時刻（ms）
(function placeMarkers() {
  var top0 = bodyEl.offsetTop, h = bodyEl.offsetHeight;
  var wrap = document.querySelector(".wrap");
  for (var i = 0; i < N_BANDS; i++) {
    var y = top0 + h * i / N_BANDS;
    bandTop.push(y); bandAt.push(null);
    var m = document.createElement("div");
    m.className = "bandmark";
    m.textContent = String.fromCharCode(65 + i); // A〜F
    m.style.top = y + "px";
    wrap.appendChild(m);
  }
})();

// ===== 計測 =====
var ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // 紛らわしい文字を除外
var tok = "";
for (var i = 0; i < 4; i++) tok += ABC[Math.floor(Math.random() * ABC.length)];
var code = tok + "-" + cond;

var t0 = Date.now();
var maxScroll = 0;
function updateScroll() {
  var h = document.documentElement.scrollHeight - window.innerHeight;
  var r = h > 0 ? window.scrollY / h : 1;
  if (r > maxScroll) maxScroll = Math.min(r, 1);
  var now = Date.now() - t0;
  var viewBottom = window.scrollY + window.innerHeight * 0.8; // 画面8割が帯に達したら「読んだ」とみなす
  for (var i = 0; i < N_BANDS; i++) {
    if (bandAt[i] === null && viewBottom > bandTop[i]) bandAt[i] = now;
  }
}
window.addEventListener("scroll", updateScroll);
window.addEventListener("load", updateScroll);

// --- ログ送信（隠しGoogleフォームへのPOST。未設定なら無効のまま動く） ---
// create_forms.gs の出力をそのまま貼る。手動なら:
//   url    = ログ用フォームの .../formResponse URL
//   entry  = 各フィールドの entry.XXXXXXX（事前入力URLから取得）
var LOG = {
  url: "",
  entry: { token: "", event: "", cond: "", scroll: "", ms: "", detail: "" }
};
function detail() {
  return JSON.stringify({ bands: bandAt, vw: window.innerWidth, vh: window.innerHeight });
}
function logEvent(ev) {
  if (!LOG.url) return;
  var p = new URLSearchParams();
  p.append(LOG.entry.token, code);
  p.append(LOG.entry.event, ev);              // open / finish / leave
  p.append(LOG.entry.cond, String(cond));
  p.append(LOG.entry.scroll, String(Math.round(maxScroll * 100)));
  p.append(LOG.entry.ms, String(Date.now() - t0));
  p.append(LOG.entry.detail, detail());
  var body = new Blob([p.toString()], { type: "application/x-www-form-urlencoded" });
  if (ev === "leave") { navigator.sendBeacon(LOG.url, body); return; }
  fetch(LOG.url, { method: "POST", mode: "no-cors", body: body });
}
logEvent("open");
var left = false;
window.addEventListener("pagehide", function () {
  if (!left) { left = true; updateScroll(); logEvent("leave"); }
});

document.getElementById("finishBtn").addEventListener("click", function () {
  updateScroll();
  left = true; // 明示的な読了は leave と二重記録しない
  logEvent("finish");
  document.getElementById("code").textContent = code;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("footer").style.display = "none";
});
</script>
</body>
